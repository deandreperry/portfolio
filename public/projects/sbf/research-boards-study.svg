<svg xmlns="http://www.w3.org/2000/svg" width="3180" height="1370" viewBox="0 0 3180 1370" role="img"><title>SBF affinity map and donor journey</title><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial, sans-serif"><text x="60" y="65" font-size="20" fill="#62359a" font-weight="650">SOCIAL BUTTERFLIES FOUNDATION</text><text x="60" y="125" font-size="42" fill="#29243d" font-weight="650">Donor usability affinity map</text><text x="60" y="175" font-size="24" fill="#29243d" font-weight="400">Moderated usability study · 10 prior donors · 5 mobile / 5 desktop</text><rect x="60" y="220" width="720" height="410" rx="8" fill="#edf7ff" stroke="#d8d3e0"/><text x="84" y="260" font-size="26" fill="#62359a" font-weight="650">T1 · Find apparel</text><text x="84" y="302" font-size="24" fill="#29243d" font-weight="650">8/10 independently completed</text><text x="84" y="350" font-size="24" fill="#29243d" font-weight="400">P04 missed the apparel category. P07 expected shirts</text><text x="84" y="384.8" font-size="24" fill="#29243d" font-weight="400">under a different category.</text><text x="84" y="487" font-size="24" fill="#29243d" font-weight="650">F03 · Category labels did not match some shoppers’</text><text x="84" y="521.8" font-size="24" fill="#29243d" font-weight="650">expectations</text><text x="84" y="560" font-size="21" fill="#29243d" font-weight="400">Test clearer apparel labels and navigation placement.</text><rect x="810" y="220" width="720" height="410" rx="8" fill="#f3edff" stroke="#d8d3e0"/><text x="834" y="260" font-size="26" fill="#62359a" font-weight="650">T2 · Personalize an item</text><text x="834" y="302" font-size="24" fill="#29243d" font-weight="650">6/10 independently completed</text><text x="834" y="350" font-size="24" fill="#29243d" font-weight="400">P02 rechecked the name field. P06 could not tell</text><text x="834" y="384.8" font-size="24" fill="#29243d" font-weight="400">whether a number had applied, and P09 was unsure</text><text x="834" y="419.6" font-size="24" fill="#29243d" font-weight="400">whether customization was confirmed.</text><text x="834" y="487" font-size="24" fill="#29243d" font-weight="650">F02 · Shoppers were unsure whether customization</text><text x="834" y="521.8" font-size="24" fill="#29243d" font-weight="650">saved</text><text x="834" y="560" font-size="21" fill="#29243d" font-weight="400">Confirm updates immediately and keep the chosen name or</text><text x="834" y="590.45" font-size="21" fill="#29243d" font-weight="400">number visible in the summary.</text><rect x="60" y="660" width="720" height="410" rx="8" fill="#fff6df" stroke="#d8d3e0"/><text x="84" y="700" font-size="26" fill="#62359a" font-weight="650">T3 · Find delivery information</text><text x="84" y="742" font-size="24" fill="#29243d" font-weight="650">5/10 independently completed</text><text x="84" y="790" font-size="24" fill="#29243d" font-weight="400">P01 searched the footer for a delivery estimate. P05</text><text x="84" y="824.8" font-size="24" fill="#29243d" font-weight="400">looked for the fulfillment policy, and P07 could not</text><text x="84" y="859.6" font-size="24" fill="#29243d" font-weight="400">see delivery reassurance.</text><text x="84" y="927" font-size="24" fill="#29243d" font-weight="650">F01 · Delivery information was hard to find</text><text x="84" y="1000" font-size="21" fill="#29243d" font-weight="400">Show a concise production and shipping estimate on the</text><text x="84" y="1030.45" font-size="21" fill="#29243d" font-weight="400">product page with a clear details link.</text><rect x="810" y="660" width="720" height="410" rx="8" fill="#edf9ef" stroke="#d8d3e0"/><text x="834" y="700" font-size="26" fill="#62359a" font-weight="650">T4 · Review the order</text><text x="834" y="742" font-size="24" fill="#29243d" font-weight="650">7/10 independently completed</text><text x="834" y="790" font-size="24" fill="#29243d" font-weight="400">P04 exited before order review. P07 stopped at</text><text x="834" y="824.8" font-size="24" fill="#29243d" font-weight="400">checkout. P09 hesitated when the total changed.</text><text x="834" y="927" font-size="24" fill="#29243d" font-weight="650">F04 · Some shoppers struggled to reach or trust</text><text x="834" y="961.8" font-size="24" fill="#29243d" font-weight="650">order review</text><text x="834" y="1000" font-size="21" fill="#29243d" font-weight="400">Put selections, full costs, and fulfillment details together</text><text x="834" y="1030.45" font-size="21" fill="#29243d" font-weight="400">before payment.</text><rect x="60" y="1120" width="1470" height="190" rx="8" fill="#f5f3f9"/><text x="84" y="1165" font-size="28" fill="#62359a" font-weight="650">What worked · P03, P08, and P10</text><text x="84" y="1210" font-size="24" fill="#29243d" font-weight="400">All three completed all four tasks independently. P03 used a collection and confirmed choices in the summary.</text><text x="84" y="1244.8" font-size="24" fill="#29243d" font-weight="400">P08 used category filters and followed the intended path. P10 checked the total and continued confidently.</text><g transform="translate(1590 0)"><text x="60" y="65" font-size="20" fill="#62359a" font-weight="650">SOCIAL BUTTERFLIES FOUNDATION</text><text x="60" y="125" font-size="42" fill="#29243d" font-weight="650">Donor journey map</text><text x="60" y="175" font-size="24" fill="#29243d" font-weight="400">Moderated usability study · 10 prior donors · 5 mobile / 5 desktop</text><rect x="60" y="240" width="278" height="580" rx="8" fill="#edf7ff" stroke="#d8d3e0"/><text x="76" y="285" font-size="27" fill="#29243d" font-weight="650">Discover</text><text x="76" y="335" font-size="20" fill="#62359a" font-weight="650">T1 · 8/10 independent</text><text x="76" y="425" font-size="24" fill="#29243d" font-weight="400">Find apparel that</text><text x="76" y="459.8" font-size="24" fill="#29243d" font-weight="400">supports SBF. Category</text><text x="76" y="494.6" font-size="24" fill="#29243d" font-weight="400">expectations can make</text><text x="76" y="529.4" font-size="24" fill="#29243d" font-weight="400">the first step harder.</text><rect x="358" y="240" width="278" height="580" rx="8" fill="#f3edff" stroke="#d8d3e0"/><text x="374" y="285" font-size="27" fill="#29243d" font-weight="650">Choose</text><text x="374" y="335" font-size="20" fill="#62359a" font-weight="650">No separate task</text><text x="374" y="364" font-size="20" fill="#62359a" font-weight="650">measure</text><text x="374" y="425" font-size="24" fill="#29243d" font-weight="400">Compare style, size,</text><text x="374" y="459.8" font-size="24" fill="#29243d" font-weight="400">and connection to the</text><text x="374" y="494.6" font-size="24" fill="#29243d" font-weight="400">mission. No separate</text><text x="374" y="529.4" font-size="24" fill="#29243d" font-weight="400">task measure or P09</text><text x="374" y="564.2" font-size="24" fill="#29243d" font-weight="400">observation was</text><text x="374" y="599" font-size="24" fill="#29243d" font-weight="400">recorded for this</text><text x="374" y="633.8" font-size="24" fill="#29243d" font-weight="400">stage.</text><rect x="656" y="240" width="278" height="580" rx="8" fill="#fff6df" stroke="#d8d3e0"/><text x="672" y="285" font-size="27" fill="#29243d" font-weight="650">Personalize</text><text x="672" y="335" font-size="20" fill="#62359a" font-weight="650">T2 · 6/10 independent</text><text x="672" y="425" font-size="24" fill="#29243d" font-weight="400">Add a name or number</text><text x="672" y="459.8" font-size="24" fill="#29243d" font-weight="400">and verify that it</text><text x="672" y="494.6" font-size="24" fill="#29243d" font-weight="400">saved. Confirmation</text><text x="672" y="529.4" font-size="24" fill="#29243d" font-weight="400">needs to stay visible.</text><rect x="954" y="240" width="278" height="580" rx="8" fill="#edf9ef" stroke="#d8d3e0"/><text x="970" y="285" font-size="27" fill="#29243d" font-weight="650">Assess trust</text><text x="970" y="335" font-size="20" fill="#62359a" font-weight="650">T3 · 5/10 independent</text><text x="970" y="425" font-size="24" fill="#29243d" font-weight="400">Check delivery timing</text><text x="970" y="459.8" font-size="24" fill="#29243d" font-weight="400">and policies before</text><text x="970" y="494.6" font-size="24" fill="#29243d" font-weight="400">deciding. Information</text><text x="970" y="529.4" font-size="24" fill="#29243d" font-weight="400">needs to be available</text><text x="970" y="564.2" font-size="24" fill="#29243d" font-weight="400">at the decision point.</text><rect x="1252" y="240" width="278" height="580" rx="8" fill="#edf9ef" stroke="#d8d3e0"/><text x="1268" y="285" font-size="27" fill="#29243d" font-weight="650">Review</text><text x="1268" y="335" font-size="20" fill="#62359a" font-weight="650">T4 · 7/10 independent</text><text x="1268" y="425" font-size="24" fill="#29243d" font-weight="400">Confirm selections and</text><text x="1268" y="459.8" font-size="24" fill="#29243d" font-weight="400">full costs before</text><text x="1268" y="494.6" font-size="24" fill="#29243d" font-weight="400">payment. A changing</text><text x="1268" y="529.4" font-size="24" fill="#29243d" font-weight="400">total can interrupt</text><text x="1268" y="564.2" font-size="24" fill="#29243d" font-weight="400">confidence.</text><rect x="60" y="880" width="1470" height="320" rx="8" fill="#f3edff"/><text x="84" y="930" font-size="28" fill="#62359a" font-weight="650">P09 · Mobile · Event supporter</text><text x="84" y="980" font-size="30" fill="#29243d" font-weight="650">Finding the product was easy. Trusting the order was harder.</text><text x="84" y="1030" font-size="24" fill="#29243d" font-weight="400">P09 found apparel and delivery information independently. During personalization, they were unsure whether</text><text x="84" y="1064.8" font-size="24" fill="#29243d" font-weight="400">customization had saved. At review, they hesitated when the total changed and did not complete the task</text><text x="84" y="1099.6" font-size="24" fill="#29243d" font-weight="400">independently.</text><text x="84" y="1155" font-size="23" fill="#29243d" font-weight="400">Proposed response · Confirm saved choices and show selections and full costs together before payment.</text></g></g></svg>